
name: Gidiovet CD

on:
  workflow_run:
    workflows: ["Gidiovet CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: gidiovet-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: i-059b97377d2fc8962
  IMAGE_NAME: ghcr.io/luonggideon-ui/gidiovet-veterinary-care

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == 'luonggideon-ui/gidiovet-veterinary-care'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate deployment script
        run: bash -n scripts/deploy.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::722375386051:role/gidiovet-github-actions-deploy-role
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify deployment target
        shell: bash
        run: |
          STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)

          echo "SSM status: $STATUS"

          if [ "$STATUS" != "Online" ]; then
            echo "Deployment target is not online"
            exit 1
          fi

      - name: Deploy application to EC2
        shell: bash
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          IMAGE="$IMAGE_NAME:$IMAGE_TAG"

          SCRIPT=$(base64 -w 0 scripts/deploy.sh)

          PARAMETERS=$(jq -n \
            --arg script "$SCRIPT" \
            --arg image "$IMAGE" \
            '{commands: [
              "set -e",
              "DEPLOY_SCRIPT=$(mktemp)",
              "trap '\''rm -f \"$DEPLOY_SCRIPT\"'\'' EXIT",
              ("echo " + $script + " | base64 -d > \"$DEPLOY_SCRIPT\""),
              ("bash \"$DEPLOY_SCRIPT\" " + ($image | @sh))
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null) || STATUS="Pending"

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed or verification timed out"
            exit 1
          fi

          echo "Gidiovet deployment successful"
