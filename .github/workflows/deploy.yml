
name: Gidiovet CD

on:
  workflow_run:
    workflows: ["Gidiovet CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: gidiovet-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == 'luonggideon-ui/gidiovet-veterinary-care'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::722375386051:role/gidiovet-github-actions-deploy-role
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify deployment target
        run: |
          aws ssm describe-instance-information \
            --region us-east-1 \
            --filters "Key=InstanceIds,Values=i-059b97377d2fc8962" \
            --query 'InstanceInformationList[].[InstanceId,PingStatus]' \
            --output table
