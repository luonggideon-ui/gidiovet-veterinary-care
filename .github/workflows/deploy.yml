
name: Gidiovet CD

on:
  workflow_run:
    workflows: ["Gidiovet CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: gidiovet-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == 'luonggideon-ui/gidiovet-veterinary-care'
    runs-on: ubuntu-latest

    steps:
      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          request = urllib.request.Request(
              url + ("&" if "?" in url else "?") + "audience=sts.amazonaws.com",
              headers={"Authorization": f"Bearer {token}"}
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub", "repository", "ref", "event_name"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::722375386051:role/gidiovet-github-actions-deploy-role
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify deployment target
        run: |
          aws ssm describe-instance-information \
            --region us-east-1 \
            --filters "Key=InstanceIds,Values=i-059b97377d2fc8962" \
            --query 'InstanceInformationList[].[InstanceId,PingStatus]' \
            --output table
