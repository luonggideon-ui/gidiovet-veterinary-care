services:
  gidiovet-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gidiovet-veterinary-care:1.0
    container_name: gidiovet-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
